<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Vida — Conway</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body.idle { cursor: none; }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }

  /* Faixa invisível no topo que revela a barra ao aproximar o mouse. */
  #trigger {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 90px;
    z-index: 5;
  }

  #bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    background: rgba(0, 0, 0, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(6px);
    transform: translateY(-105%);
    opacity: 0;
    transition: transform 0.28s ease, opacity 0.28s ease;
  }
  #bar.show { transform: translateY(0); opacity: 1; }

  button, select {
    font: inherit;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 5px 12px;
    cursor: pointer;
  }
  .fakebtn {
    font: inherit;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover, select:hover, .fakebtn:hover { background: #fff; color: #000; }
  button.off { opacity: 0.4; }
  label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=range] { accent-color: #fff; width: 110px; }
  input[type=color] {
    width: 30px;
    height: 26px;
    padding: 0;
    border: 1px solid #fff;
    background: #000;
    cursor: pointer;
  }
  input[type=text] {
    font: inherit;
    width: 44px;
    text-align: center;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 4px 2px;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; }
  input[type=color]::-moz-color-swatch { border: none; }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.35); }
  .status { opacity: 0.65; white-space: nowrap; }
  .status b { font-weight: 600; }

  #hint {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    z-index: 4;
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #hint.gone { opacity: 0; }

  /* Botão flutuante que abre a barra onde não existe hover (celular). */
  #barToggle {
    display: none;
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 11;
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    opacity: 0.8;
  }

  .only-touch { display: none; }

  @media (hover: none) {
    /* Sem hover a faixa do topo não serve para nada e ainda rouba o toque
       de quem quer desenhar ali — some, e o botão flutuante assume. */
    #trigger { display: none; }
    #barToggle { display: block; }
    /* Some com o que é ruim de operar no toque: seletores de cor nativos e
       o campo de caractere, que exigiria abrir o teclado de emoji. O botão
       🎨 Cores continua lá e cobre a troca de cores. */
    .only-mouse { display: none; }
    .only-touch { display: inline; }
    body.idle { cursor: auto; }
  }

  @media (max-width: 760px) {
    #bar {
      gap: 6px;
      padding: 8px 10px;
      font-size: 12px;
      /* Com muitos controles a barra passa da tela: rola dentro de si. */
      max-height: 72vh;
      overflow-y: auto;
    }
    #bar .sep { display: none; }
    #bar button { padding: 6px 10px; }
    input[type=text] { width: 40px; }
    #bar label { gap: 4px; }
    input[type=range] { width: 82px; }
    input[type=color] { width: 34px; height: 30px; }
    #hint {
      font-size: 11px;
      bottom: 70px;
      padding: 0 70px 0 14px;
    }
  }

  @media (max-width: 400px) {
    #bar { font-size: 11px; }
    input[type=range] { width: 68px; }
  }
</style>
</head>
<body>

<canvas id="board"></canvas>
<div id="trigger"></div>

<div id="bar">
  <button id="playBtn">❚❚ Pause</button>
  <button id="randomBtn">Aleatório</button>
  <button id="clearBtn">Limpar</button>
  <div class="sep"></div>
  <label>Vel <input type="range" id="speed" min="1" max="60" value="12"></label>
  <button id="gridBtn">Grade</button>
  <div class="sep"></div>
  <label class="only-mouse">Fundo <input type="color" id="bgColor" value="#000000"></label>
  <label class="only-mouse">Células <input type="color" id="cellColor" value="#ffffff"></label>
  <button id="changeBtn">🌈 Colorir</button>
  <label class="only-mouse" title="Caractere desenhado em cada célula viva (vazio = quadrado)">
    Char <input type="text" id="glyph" maxlength="2" placeholder="■" autocomplete="off">
  </label>
  <button id="rndColorBtn">🎨 Cores</button>
  <label id="imgBtn" class="fakebtn" title="Usar uma imagem do seu computador como célula">
    🖼 Imagem<input type="file" id="imgInput" accept="image/*" hidden>
  </label>
  <button id="imgClearBtn" hidden title="Voltar ao quadrado">✕</button>
  <div class="sep"></div>
  <button id="modelBtn">⬡ Modelo</button>
  <button id="seedBtn">⁂ Semear</button>
  <button id="infiniteBtn" class="off" title="Nunca deixa o mundo morrer">∞ Infinito</button>
  <button id="edgeBtn" class="off" title="Sem passagem: quem cruza a borda morre em vez de reaparecer do outro lado">⊘ Sem passagem</button>
  <div class="sep"></div>
  <div class="status">Ger <b id="gen">0</b> · Vivas <b id="alive">0</b></div>
</div>

<button id="barToggle" aria-label="Mostrar controles">⋯</button>

<p id="hint">
  <span class="only-mouse">Mouse no topo = controles · clique = desenhar · roda = zoom no cursor · Shift+arraste ou botão do meio = mover · 0 = centralizar · Espaço = play/pause · M = modelo · X = cores</span>
  <span class="only-touch">Toque no ⋯ para os controles · arraste na tela para desenhar · dois dedos para mover</span>
</p>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

const BASE_CELL = 10;   // tamanho da célula com a câmera em 100%
const FIT_CELL = 4;     // no zoom mínimo o mundo inteiro cabe na tela
const MAX_CELL = 60;

// O mundo é maior que a janela (tela ÷ FIT_CELL células), então afastar
// revela espaço de verdade em vez de repetir o mesmo padrão.

let COLS = 0, ROWS = 0;

// Câmera: (x, y) é a coordenada do mundo, em células, colada no canto
// superior esquerdo da tela; `cell` é quantos pixels cada célula ocupa.
// A simulação não sabe da câmera — só o desenho e o clique a consultam.
const view = { x: 0, y: 0, cell: BASE_CELL };

// Dois buffers fixos: step() escreve no de trás e troca os ponteiros,
// então nenhuma memória é alocada por geração.
let grid = new Uint8Array(0);
let back = new Uint8Array(0);

let generation = 0;
let running = true;
let showGrid = true;
let fps = 12;
let lastFrame = 0;
let aliveCount = 0;
let bgColor = '#000000';
let cellColor = '#ffffff';
let glyph = '';           // vazio = célula quadrada sólida

// Bordas em toro (padrão) ou fechadas: com wrapEdges falso, a vizinhança
// além da borda conta como morta, então o que sai simplesmente some.
let wrapEdges = true;

// Modo infinito: vigia a população e injeta modelos novos quando o mundo
// estagna, para a tela nunca parar. Num toro finito o estado acaba se
// repetindo por definição — a realimentação é o que mantém a coisa viva.
let infiniteMode = false;
const popHistory = [];
let lastInject = -Infinity;

// Imagem escolhida pelo usuário, desenhada no lugar da célula. Fica só na
// memória do navegador — nada é enviado para lugar nenhum.
let cellImage = null;
let imgTile = null;       // a imagem já reduzida ao tamanho da célula
let imgTileSize = 0;

// Modo "change": a matiz das células desliza continuamente. Guardamos
// saturação e luminosidade para o ciclo não mexer no contraste com o fundo.
const HUE_PER_SEC = 3;        // uma volta completa a cada 2 min
let changeMode = true;   // ligado por padrão
let cycleHue = 0, cycleSat = 85, cycleLight = 62;
let lastHueTime = 0;

const idx = (x, y) => y * COLS + x;

// --- dimensionamento ------------------------------------------------------

// O mundo tem tamanho próprio, independente do zoom: só cresce se a janela
// passar a exigir mais células a 100%. Assim dar zoom não destrói o padrão.
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const needCols = Math.max(1, Math.ceil(w / FIT_CELL));
  const needRows = Math.max(1, Math.ceil(h / FIT_CELL));

  if (needCols > COLS || needRows > ROWS) {
    const oldCols = COLS, oldRows = ROWS, old = grid;
    COLS = Math.max(COLS, needCols);
    ROWS = Math.max(ROWS, needRows);
    grid = new Uint8Array(COLS * ROWS);
    back = new Uint8Array(COLS * ROWS);

    for (let y = 0; y < oldRows; y++) {
      for (let x = 0; x < oldCols; x++) {
        grid[y * COLS + x] = old[y * oldCols + x];
      }
    }
    recount();
  }
  clampView();
  draw();
}

// --- câmera ---------------------------------------------------------------

const wrap = (v, n) => ((v % n) + n) % n;

// Zoom mínimo: aquele em que o mundo inteiro cabe na tela. Abaixo disso
// sobraria vazio (ou repetição), então é o limite.
function minCell() {
  return Math.max(window.innerWidth / COLS, window.innerHeight / ROWS);
}

// Prende a câmera dentro do mundo, para nunca aparecer o mundo repetido.
function clampView() {
  const w = window.innerWidth, h = window.innerHeight;
  const visCols = w / view.cell, visRows = h / view.cell;
  view.x = visCols >= COLS ? (COLS - visCols) / 2
                           : Math.max(0, Math.min(COLS - visCols, view.x));
  view.y = visRows >= ROWS ? (ROWS - visRows) / 2
                           : Math.max(0, Math.min(ROWS - visRows, view.y));
}

// Aplica um novo tamanho de célula mantendo fixo o ponto do mundo que está
// sob (sx, sy) na tela — é isso que faz o zoom "puxar" para o cursor.
function zoomAt(newCell, sx, sy) {
  newCell = Math.max(minCell(), Math.min(MAX_CELL, newCell));
  if (newCell === view.cell) return;
  const wx = view.x + sx / view.cell;
  const wy = view.y + sy / view.cell;
  view.cell = newCell;
  view.x = wx - sx / newCell;
  view.y = wy - sy / newCell;
  clampView();
  draw();
}

// Volta a 100%, olhando para o centro do mundo (onde os modelos nascem).
function resetView() {
  view.cell = Math.max(minCell(), BASE_CELL);
  view.x = (COLS - window.innerWidth / view.cell) / 2;
  view.y = (ROWS - window.innerHeight / view.cell) / 2;
  clampView();
  draw();
}

// --- regras ---------------------------------------------------------------

// Vizinhança de Moore com bordas em toro (o tabuleiro dá a volta).
function step() {
  const next = back;
  let count = 0;

  for (let y = 0; y < ROWS; y++) {
    const mid = y * COLS;
    // Com passagem, as linhas de fora dão a volta; sem passagem, o que
    // estaria fora simplesmente não existe (-1 marca "linha inexistente").
    const up = wrapEdges ? ((y - 1 + ROWS) % ROWS) * COLS : (y > 0 ? mid - COLS : -1);
    const down = wrapEdges ? ((y + 1) % ROWS) * COLS : (y < ROWS - 1 ? mid + COLS : -1);

    for (let x = 0; x < COLS; x++) {
      const l = wrapEdges ? (x - 1 + COLS) % COLS : (x > 0 ? x - 1 : -1);
      const r = wrapEdges ? (x + 1) % COLS : (x < COLS - 1 ? x + 1 : -1);

      let n = 0;
      if (up >= 0) {
        if (l >= 0) n += grid[up + l];
        n += grid[up + x];
        if (r >= 0) n += grid[up + r];
      }
      if (l >= 0) n += grid[mid + l];
      if (r >= 0) n += grid[mid + r];
      if (down >= 0) {
        if (l >= 0) n += grid[down + l];
        n += grid[down + x];
        if (r >= 0) n += grid[down + r];
      }

      const alive = grid[mid + x];
      const v = (alive && (n === 2 || n === 3)) || (!alive && n === 3) ? 1 : 0;
      next[mid + x] = v;
      count += v;
    }
  }

  back = grid;
  grid = next;
  aliveCount = count;
  generation++;
}

// --- desenho --------------------------------------------------------------

// Reduz a imagem escolhida para um quadrado do tamanho da célula, mantendo
// a proporção original (sobra transparente nas bordas em vez de esticar).
function buildImgTile(size) {
  imgTile = document.createElement('canvas');
  imgTile.width = imgTile.height = size;
  const c = imgTile.getContext('2d');
  const scale = Math.min(size / cellImage.width, size / cellImage.height);
  const w = cellImage.width * scale, h = cellImage.height * scale;
  c.drawImage(cellImage, (size - w) / 2, (size - h) / 2, w, h);
  imgTileSize = size;
}

// Linhas da grade: a cor das células bem apagada, pra acompanhar o tema.
function gridLineColor() {
  const n = parseInt(cellColor.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, 0.14)`;
}

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, w, h);

  const cell = view.cell;
  // Só as células que caem na tela; fora dos limites o mundo se repete,
  // coerente com as bordas em toro da simulação.
  const c0 = Math.floor(view.x), c1 = Math.ceil(view.x + w / cell);
  const r0 = Math.floor(view.y), r1 = Math.ceil(view.y + h / cell);

  ctx.fillStyle = cellColor;

  // Abaixo de 6 px imagem e caractere viram borrão ilegível e custam caro
  // de desenhar, então nesse zoom o quadrado sólido assume de volta.
  const legible = cell >= 6;
  const useImage = cellImage && legible;
  const useGlyph = !useImage && glyph && legible;

  if (useImage) {
    // A imagem é reduzida uma vez para o tamanho da célula; o laço então só
    // faz blit de um bitmap já do tamanho certo, em vez de reescalar 30 mil
    // vezes por quadro.
    const size = Math.max(1, Math.round(cell));
    if (!imgTile || imgTileSize !== size) buildImgTile(size);
    for (let r = r0; r < r1; r++) {
      const row = wrap(r, ROWS) * COLS;
      const sy = Math.round((r - view.y) * cell);
      for (let c = c0; c < c1; c++) {
        if (grid[row + wrap(c, COLS)]) {
          ctx.drawImage(imgTile, Math.round((c - view.x) * cell), sy);
        }
      }
    }
  } else if (useGlyph) {
    ctx.font = `${(cell * 0.92).toFixed(1)}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let r = r0; r < r1; r++) {
      const row = wrap(r, ROWS) * COLS;
      const sy = (r - view.y) * cell + cell / 2;
      for (let c = c0; c < c1; c++) {
        if (grid[row + wrap(c, COLS)]) {
          ctx.fillText(glyph, (c - view.x) * cell + cell / 2, sy);
        }
      }
    }
  } else {
    const size = Math.ceil(cell);
    for (let r = r0; r < r1; r++) {
      const row = wrap(r, ROWS) * COLS;
      const sy = (r - view.y) * cell;
      for (let c = c0; c < c1; c++) {
        if (grid[row + wrap(c, COLS)]) {
          ctx.fillRect((c - view.x) * cell, sy, size, size);
        }
      }
    }
  }

  if (showGrid && cell >= 5) {
    ctx.strokeStyle = gridLineColor();
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = c0; c <= c1; c++) {
      const sx = Math.round((c - view.x) * cell) + 0.5;
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, h);
    }
    for (let r = r0; r <= r1; r++) {
      const sy = Math.round((r - view.y) * cell) + 0.5;
      ctx.moveTo(0, sy);
      ctx.lineTo(w, sy);
    }
    ctx.stroke();
  }

  document.getElementById('gen').textContent = generation;
  document.getElementById('alive').textContent = aliveCount;
}

function recount() {
  let c = 0;
  for (let i = 0; i < grid.length; i++) c += grid[i];
  aliveCount = c;
}

function loop(now) {
  requestAnimationFrame(loop);
  let dirty = false;

  // A cor desliza mesmo com a simulação pausada.
  if (changeMode) {
    const dt = Math.min(0.1, (now - lastHueTime) / 1000);
    lastHueTime = now;
    cycleHue = (cycleHue + dt * HUE_PER_SEC) % 360;
    cellColor = hsl(cycleHue, cycleSat, cycleLight);
    cellInput.value = cellColor;
    dirty = true;
  }

  if (running && now - lastFrame >= 1000 / fps) {
    lastFrame = now;
    step();
    dirty = true;

    if (infiniteMode) {
      popHistory.push(aliveCount);
      if (popHistory.length > STALE_WINDOW + 60) popHistory.shift();
      if (generation - lastInject > INJECT_COOLDOWN && aliveCount < CROWDED && worldIsStale()) {
        feedWorld();
      }
    }
  }

  if (dirty) draw();
}

// --- interação ------------------------------------------------------------

let painting = false, paintValue = 1, lastCell = null;

// Tela → célula do mundo, atravessando a câmera. Sempre acerta alguma
// célula: coordenadas fora dos limites voltam pelo outro lado do toro.
function cellAt(e) {
  const x = wrap(Math.floor(view.x + e.clientX / view.cell), COLS);
  const y = wrap(Math.floor(view.y + e.clientY / view.cell), ROWS);
  return { x, y };
}

let panning = false, panStart = null;

// Toque: um dedo desenha, dois dedos movem e dão zoom (pinça). Guardamos
// todos os ponteiros ativos para saber em qual dos dois casos estamos.
const pointers = new Map();
let gesture = null;

function gestureState() {
  const [a, b] = [...pointers.values()];
  return {
    dist: Math.hypot(a.x - b.x, a.y - b.y),
    midX: (a.x + b.x) / 2,
    midY: (a.y + b.y) / 2,
  };
}

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    // Chegou o segundo dedo: vira gesto de câmera, o desenho é abortado.
    painting = false;
    panning = false;
    lastCell = null;
    gesture = gestureState();
    return;
  }
  if (pointers.size > 2) return;

  // Botão do meio, direito ou Shift+esquerdo arrastam a câmera.
  if (e.button === 1 || e.button === 2 || e.shiftKey) {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    panning = true;
    panStart = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    return;
  }

  const c = cellAt(e);
  if (!c) return;
  canvas.setPointerCapture(e.pointerId);
  painting = true;
  // O primeiro clique define se o arrasto pinta ou apaga.
  paintValue = grid[idx(c.x, c.y)] ? 0 : 1;
  grid[idx(c.x, c.y)] = paintValue;
  lastCell = c;
  recount();
  draw();
});

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2 && gesture) {
    const g = gestureState();
    // Arrasta pelo deslocamento do ponto médio…
    view.x -= (g.midX - gesture.midX) / view.cell;
    view.y -= (g.midY - gesture.midY) / view.cell;
    clampView();
    // …e dá zoom pela variação da distância entre os dedos, ancorado neles.
    if (gesture.dist > 0) zoomAt(view.cell * (g.dist / gesture.dist), g.midX, g.midY);
    gesture = g;
    draw();
    return;
  }

  if (panning) {
    view.x = panStart.vx - (e.clientX - panStart.sx) / view.cell;
    view.y = panStart.vy - (e.clientY - panStart.sy) / view.cell;
    clampView();
    draw();
    return;
  }
  if (!painting) return;
  const c = cellAt(e);
  if (!c || (lastCell && c.x === lastCell.x && c.y === lastCell.y)) return;
  grid[idx(c.x, c.y)] = paintValue;
  lastCell = c;
  recount();
  draw();
});

function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) gesture = null;
  painting = false;
  panning = false;
  lastCell = null;
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

// Arrastar com o botão direito não deve abrir o menu de contexto.
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Roda do mouse: zoom exponencial ancorado no cursor.
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoomAt(view.cell * factor, e.clientX, e.clientY);
}, { passive: false });

// --- barra de controles ---------------------------------------------------

const bar = document.getElementById('bar');
const trigger = document.getElementById('trigger');
let barTimer = null;

function showBar() {
  bar.classList.add('show');
  clearTimeout(barTimer);
}
function hideBarSoon() {
  clearTimeout(barTimer);
  barTimer = setTimeout(() => bar.classList.remove('show'), 500);
}

document.getElementById('barToggle').addEventListener('click', e => {
  e.stopPropagation();
  clearTimeout(barTimer);
  bar.classList.toggle('show');
});

trigger.addEventListener('pointerenter', showBar);
trigger.addEventListener('pointerleave', hideBarSoon);
bar.addEventListener('pointerenter', showBar);
bar.addEventListener('pointerleave', hideBarSoon);

// --- sopa aleatória --------------------------------------------------------

// Ruído de valor: grade grossa de aleatórios interpolada. Serve para
// modular a densidade e criar regiões densas e ralas, em vez de estática
// uniforme onde tudo é igual em todo lugar.
function valueNoise(cols, rows, res) {
  const gx = res + 1, gy = res + 1;
  const g = new Float32Array(gx * gy);
  for (let i = 0; i < g.length; i++) g[i] = Math.random();
  const out = new Float32Array(cols * rows);
  for (let y = 0; y < rows; y++) {
    const fy = y / rows * res, y0 = Math.floor(fy), ty = fy - y0;
    for (let x = 0; x < cols; x++) {
      const fx = x / cols * res, x0 = Math.floor(fx), tx = fx - x0;
      const a = g[y0 * gx + x0], b = g[y0 * gx + x0 + 1];
      const c = g[(y0 + 1) * gx + x0], d = g[(y0 + 1) * gx + x0 + 1];
      out[y * cols + x] = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
    }
  }
  return out;
}

// Preenche um buffer com uma sopa segundo os parâmetros dados.
// sym: 0 = nenhuma, 2 = espelhada na vertical, 4 = espelhada nos dois eixos.
function fillSoup(buf, cols, rows, p) {
  buf.fill(0);
  const noise = p.clump ? valueNoise(cols, rows, 5 + Math.floor(Math.random() * 6)) : null;
  const lastC = p.sym ? Math.ceil(cols / 2) : cols;
  const lastR = p.sym === 4 ? Math.ceil(rows / 2) : rows;
  for (let y = 0; y < lastR; y++) {
    for (let x = 0; x < lastC; x++) {
      const d = noise ? p.density * (0.2 + 1.8 * noise[y * cols + x]) : p.density;
      if (Math.random() >= d) continue;
      buf[y * cols + x] = 1;
      if (p.sym) buf[y * cols + (cols - 1 - x)] = 1;
      if (p.sym === 4) {
        buf[(rows - 1 - y) * cols + x] = 1;
        buf[(rows - 1 - y) * cols + (cols - 1 - x)] = 1;
      }
    }
  }
}

// Roda a sopa num tabuleiro de teste e pontua o quanto ela ainda ferve.
// População sozinha premiaria campos entulhados de blocos parados; a
// agitação (células que mudam de estado) é o que separa vivo de assentado.
function scoreSoup(a, b, cols, rows, gens) {
  let cur = a, nxt = b, churn = 0, pop = 0;
  for (let g = 0; g < gens; g++) {
    let changed = 0, alive = 0;
    for (let y = 0; y < rows; y++) {
      const up = ((y - 1 + rows) % rows) * cols, mid = y * cols, dn = ((y + 1) % rows) * cols;
      for (let x = 0; x < cols; x++) {
        const l = (x - 1 + cols) % cols, r = (x + 1) % cols;
        const n = cur[up + l] + cur[up + x] + cur[up + r] + cur[mid + l] +
                  cur[mid + r] + cur[dn + l] + cur[dn + x] + cur[dn + r];
        const was = cur[mid + x];
        const v = (was && (n === 2 || n === 3)) || (!was && n === 3) ? 1 : 0;
        nxt[mid + x] = v;
        alive += v;
        if (v !== was) changed++;
      }
    }
    const t = cur; cur = nxt; nxt = t;
    pop = alive;
    if (g >= gens - 30) churn += changed;
  }
  return pop + 2 * (churn / 30);
}

const SOUP_CANDIDATES = 6;
const TEST_COLS = 200, TEST_ROWS = 120;
const testA = new Uint8Array(TEST_COLS * TEST_ROWS);
const testB = new Uint8Array(TEST_COLS * TEST_ROWS);

// Melhor de k: sorteia várias receitas de sopa, roda cada uma num tabuleiro
// de teste pequeno e usa no mundo só a que mais ferveu. Os candidatos variam
// nos parâmetros, não só na semente — sopas do mesmo tipo num mundo grande
// se comportam quase igual, e escolher entre elas não adiantaria nada.
function randomize() {
  let best = null, bestScore = -1;
  for (let i = 0; i < SOUP_CANDIDATES; i++) {
    const r = Math.random();
    const p = {
      density: 0.10 + Math.random() * 0.35,
      sym: r < 0.25 ? 4 : r < 0.5 ? 2 : 0,
      clump: Math.random() < 0.5,
    };
    fillSoup(testA, TEST_COLS, TEST_ROWS, p);
    const s = scoreSoup(testA, testB, TEST_COLS, TEST_ROWS, 100);
    if (s > bestScore) { bestScore = s; best = p; }
  }

  fillSoup(grid, COLS, ROWS, best);
  generation = 0;
  recount();
  draw();

  const how = [
    `densidade ${(best.density * 100).toFixed(0)}%`,
    best.sym === 4 ? 'simetria dupla' : best.sym === 2 ? 'espelhada' : null,
    best.clump ? 'em manchas' : null,
  ].filter(Boolean).join(' · ');
  toast(`Sopa escolhida entre ${SOUP_CANDIDATES}: ${how}`);
}

// Hex → HSL, para o ciclo começar exatamente da cor que está na tela.
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  const l = (max + min) / 2;
  if (!d) return [0, 0, l * 100];
  const s = d / (1 - Math.abs(2 * l - 1));
  let h;
  if (max === r) h = ((g - b) / d) % 6;
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return [((h * 60) % 360 + 360) % 360, s * 100, l * 100];
}

// Faz o ciclo partir da cor atual das células.
function seedCycle() {
  const [h, s, l] = hexToHsl(cellColor);
  cycleHue = h;
  // Branco e preto não têm matiz para girar: injeta cor mantendo o brilho.
  cycleSat = s < 35 ? 85 : s;
  cycleLight = s < 35 ? (l > 50 ? 62 : 45) : l;
  lastHueTime = performance.now();
}

function hsl(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

// Sorteia um par com contraste garantido: matizes distantes e

  if (lightBg) {
    bgInput.value = hsl(h2, 30 + Math.random() * 40, 88 + Math.random() * 8);
    cellInput.value = hsl(h, 60 + Math.random() * 40, 20 + Math.random() * 20);
  } else {
    bgInput.value = hsl(h2, 40 + Math.random() * 50, 4 + Math.random() * 9);
    cellInput.value = hsl(h, 65 + Math.random() * 35, 55 + Math.random() * 25);
  }
  applyColors();
  if (changeMode) seedCycle();   // o ciclo continua, agora da cor sorteada
};

      [2,7],[13,7],[2,8],[13,8],[3,3],[12,3],[3,12],[12,12],[5,3],[10,3],
      [5,12],[10,12],[3,5],[12,5],[3,10],[12,10],[6,3],[9,3],[6,12],[9,12],
      [3,6],[12,6],[3,9],[12,9],[5,5],[10,5],[5,10],[10,10],[7,5],[8,5],
      [7,10],[8,10],[5,7],[10,7],[5,8],[10,8],[7,7],[8,7],[7,8],[8,8]
    ] },

  { name: 'Caleidoscópio V', note: 'simétrico 12x12 · caleidoscópio por 156 gerações',
    cells: [
      [1,1],[10,1],[1,10],[10,10],[2,1],[9,1],[2,10],[9,10],[1,2],[10,2],
      [1,9],[10,9],[5,1],[6,1],[5,10],[6,10],[1,5],[10,5],[1,6],[10,6],
      [5,2],[6,2],[5,9],[6,9],[2,5],[9,5],[2,6],[9,6],[3,3],[8,3],
      [3,8],[8,8],[4,3],[7,3],[4,8],[7,8],[3,4],[8,4],[3,7],[8,7],
      [5,3],[6,3],[5,8],[6,8],[3,5],[8,5],[3,6],[8,6],[4,4],[7,4],
      [4,7],[7,7]
    ] },

  { name: 'Caleidoscópio VI', note: 'simétrico 10x10 · caleidoscópio por 154 gerações',
    cells: [
      [1,0],[8,0],[1,9],[8,9],[0,1],[9,1],[0,8],[9,8],[2,0],[7,0],
      [2,9],[7,9],[0,2],[9,2],[0,7],[9,7],[1,1],[8,1],[1,8],[8,8],
      [2,2],[7,2],[2,7],[7,7],[3,2],[6,2],[3,7],[6,7],[2,3],[7,3],
      [2,6],[7,6],[3,3],[6,3],[3,6],[6,6],[4,4],[5,4],[4,5],[5,5]
    ] },
];

const MARGIN = 2;        // moldura limpa ao redor de cada inserção
const SCATTER_PAD = 6;   // folga entre modelos ao semear, para não se fundirem

const modelW = m => Math.max(...m.cells.map(c => c[0])) + 1;
const modelH = m => Math.max(...m.cells.map(c => c[1])) + 1;

// Carimba o modelo em (ox, oy), abrindo espaço em volta: sem isso ele
// nasce contaminado pelo que estiver por perto e não evolui como deveria.
function stampModel(m, ox, oy) {
  const w = modelW(m), h = modelH(m);
  for (let y = -MARGIN; y < h + MARGIN; y++) {
    for (let x = -MARGIN; x < w + MARGIN; x++) {
      grid[idx(wrap(ox + x, COLS), wrap(oy + y, ROWS))] = 0;
    }
  }
  for (const [x, y] of m.cells) {
    grid[idx(wrap(ox + x, COLS), wrap(oy + y, ROWS))] = 1;
  }
}

// Há espaço livre para o modelo ali, contando uma folga `pad`?
function areaFree(m, ox, oy, pad) {
  const w = modelW(m), h = modelH(m);
  for (let y = -pad; y < h + pad; y++) {
    for (let x = -pad; x < w + pad; x++) {
      if (grid[idx(wrap(ox + x, COLS), wrap(oy + y, ROWS))]) return false;
    }
  }
  return true;
}

// Solta o modelo num ponto qualquer da área visível, sem apagar o resto do
// mundo nem mexer na câmera ou no contador de gerações.
function insertModel(m, quiet) {
  // Sorteia dentro do que está na tela, senão o modelo cairia fora da vista.
  const visCols = Math.min(COLS, window.innerWidth / view.cell);
  const visRows = Math.min(ROWS, window.innerHeight / view.cell);
  const rx = Math.floor(view.x + MARGIN + Math.random() * Math.max(1, visCols - modelW(m) - 2 * MARGIN));
  const ry = Math.floor(view.y + MARGIN + Math.random() * Math.max(1, visRows - modelH(m) - 2 * MARGIN));
  const [ox, oy] = fitSpot(m, rx, ry);

  stampModel(m, ox, oy);
  recount();
  draw();
  if (!quiet) toast(`${m.name} — ${m.note}`);
}

// Peso no sorteio. Osciladores e vidas estáticas ficam parados num canto;
// naves e canhões é que dão movimento à tela, então aparecem mais. Quem não
// está na lista vale 1.
const WEIGHTS = {
  'Max': 10,                    // spacefiller: enche a tela de listras
  'Gosper Glider Gun': 8,       // dispara gliders para sempre
  'Crescimento infinito': 6,    // população nunca para de crescer
  'Copperhead': 5,
  'Glider': 5,
  'Nave leve (LWSS)': 5,
  'MWSS': 5,
  'HWSS': 5,
  'Canhão de período 24': 6,
  'Pufferfish': 5,
  'Síntese do Dart': 4,
  'Snark loop': 2,
  'Space rake': 6,              // voa cuspindo gliders
  'Simkin glider gun': 6,
  'Puffer 2': 5,
  'Arca de Noé': 4,
  'Loafer': 5, 'Weekender': 5, 'Spider': 5, 'Dart': 5,
  'Ganso do Canadá': 5, 'Schick engine': 5,
  'Queen bee shuttle': 2, 'Twin bees shuttle': 2, 'Shuttle p54': 2,
  'Edna': 3, 'Lidka': 3, 'Bunnies': 3, 'Multum in parvo': 3,
  'Acorn': 3,                   // metusaléns que espalham gliders longe
  'R-pentomino': 3,
  'Rabbits': 3,
};
const weightOf = m => WEIGHTS[m.name] || 1;

// Na mistura do Semear o Max entra com peso muito menor: dezenas deles
// preenchem a tela em segundos e engolem todo o resto. Sozinho, em
// monocultura ou pelo botão Modelo ele continua com o peso cheio.
const SCATTER_WEIGHTS = { 'Max': 0.5 };
const scatterWeightOf = m => SCATTER_WEIGHTS[m.name] ?? weightOf(m);

const TOTAL_WEIGHT = MODELS.reduce((a, m) => a + weightOf(m), 0);
const SCATTER_TOTAL = MODELS.reduce((a, m) => a + scatterWeightOf(m), 0);

function pickWeighted(weight, total) {
  let r = Math.random() * total;
  for (const m of MODELS) {
    r -= weight(m);
    if (r <= 0) return m;
  }
  return MODELS[MODELS.length - 1];
}

const randomModel = () => pickWeighted(weightOf, TOTAL_WEIGHT);
const randomScatterModel = () => pickWeighted(scatterWeightOf, SCATTER_TOTAL);

// --- amostragem ------------------------------------------------------------

// Uma das 8 simetrias do quadrado (4 rotações × espelhado). Sem isso todo
// glider do mundo voa para o mesmo canto e todo puffer aponta para o mesmo
// lado; com isso as naves cruzam o mundo em todas as direções e colidem.
function orientModel(m) {
  const t = Math.floor(Math.random() * 8);
  if (t === 0) return m;
  let cells = m.cells.map(([x, y]) => {
    switch (t & 3) {
      case 1: return [-y, x];
      case 2: return [-x, -y];
      case 3: return [y, -x];
      default: return [x, y];
    }
  });
  if (t & 4) cells = cells.map(([x, y]) => [-x, y]);
  const mx = Math.min(...cells.map(c => c[0]));
  const my = Math.min(...cells.map(c => c[1]));
  return { name: m.name, note: m.note, cells: cells.map(([x, y]) => [x - mx, y - my]) };
}

// Normal padrão (Box-Muller), para o espalhamento em torno dos aglomerados.
function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Amostragem estratificada: uma posição sorteada dentro de cada célula de
// uma grade. Cobertura garantida, sem os aglomerados e buracos que o
// sorteio uniforme produz — mas ainda sem parecer alinhado.
function stratifiedSpots(target) {
  const gx = Math.max(1, Math.round(Math.sqrt(target * COLS / ROWS)));
  const gy = Math.max(1, Math.ceil(target / gx));
  const cw = COLS / gx, ch = ROWS / gy;
  const spots = [];
  for (let j = 0; j < gy; j++) {
    for (let i = 0; i < gx; i++) {
      spots.push([Math.floor((i + Math.random()) * cw), Math.floor((j + Math.random()) * ch)]);
    }
  }
  return shuffle(spots);
}

// Processo de aglomeração (Thomas): poucos pontos-pai, filhos espalhados
// em torno com desvio gaussiano. Cria bairros densos separados por vazio,
// e o que escapa de um bairro viaja até colidir com o vizinho.
function clusteredSpots(target) {
  const parents = 3 + Math.floor(Math.random() * 5);
  const sigma = 14 + Math.random() * 16;
  const px = [], py = [];
  for (let i = 0; i < parents; i++) {
    px.push(Math.random() * COLS);
    py.push(Math.random() * ROWS);
  }
  const spots = [];
  for (let i = 0; i < target; i++) {
    const p = i % parents;
    spots.push([Math.floor(px[p] + gauss() * sigma), Math.floor(py[p] + gauss() * sigma)]);
  }
  return shuffle(spots);
}

// No toro qualquer posição serve; com bordas fechadas o modelo precisa
// caber inteiro dentro do mundo, senão nasceria partido nas duas pontas.
function fitSpot(m, ox, oy) {
  if (wrapEdges) return [wrap(ox, COLS), wrap(oy, ROWS)];
  return [
    Math.max(0, Math.min(COLS - modelW(m), ox)),
    Math.max(0, Math.min(ROWS - modelH(m), oy)),
  ];
}

// Planta o modelo bem no meio do que está na tela.
function centerModel(m) {
  const cx = Math.floor(view.x + (Math.min(COLS, window.innerWidth / view.cell) - modelW(m)) / 2);
  const cy = Math.floor(view.y + (Math.min(ROWS, window.innerHeight / view.cell) - modelH(m)) / 2);
  const [ox, oy] = fitSpot(m, cx, cy);
  stampModel(m, ox, oy);
  recount();
  draw();
}

// Dois sorteios raros que dão variedade ao Semear.
const SOLO_CHANCE = 1 / MODELS.length;   // um único modelo, sozinho no centro
const MONO_CHANCE = 0.20;                // mundo inteiro de um só modelo
const DUAL_CHANCE = 0.10;                // dualcultura: só dois modelos
const TRIO_CHANCE = 0.10;                // tricultura: só três
const CLUSTER_CHANCE = 0.35;             // layout aglomerado em vez de espalhado

// Sorteia de quantos modelos distintos o mundo será feito.
// null = galeria inteira, como sempre foi.
function drawPalette() {
  const r = Math.random();
  let size = 0;
  if (r < MONO_CHANCE) size = 1;
  else if (r < MONO_CHANCE + DUAL_CHANCE) size = 2;
  else if (r < MONO_CHANCE + DUAL_CHANCE + TRIO_CHANCE) size = 3;
  if (!size) return null;

  const palette = [];
  // Modelos distintos; o contador evita laço infinito se a galeria encolher.
  for (let tries = 0; palette.length < size && tries < 200; tries++) {
    const m = randomModel();
    if (!palette.includes(m)) palette.push(m);
  }
  return palette;
}

// Limpa tudo e espalha modelos pelo mundo inteiro, bem separados uns dos
// outros — uma alternativa à sopa aleatória, que só vira caos indistinto.
function scatterModels() {
  grid.fill(0);
  generation = 0;

  // 1 em N: em vez da semeadura, um exemplar só, no meio da tela.
  if (Math.random() < SOLO_CHANCE) {
    const m = orientModel(randomModel());
    centerModel(m);
    toast(`Sozinho no centro: ${m.name} — ${m.note}`);
    return;
  }

  const palette = drawPalette();

  const target = Math.max(4, Math.round(COLS * ROWS / 2200));

  // Layout é sorteado à parte da paleta: um decide onde, o outro decide
  // o quê. Existe monocultura aglomerada, tricultura estratificada, etc.
  const clustered = Math.random() < CLUSTER_CHANCE;
  const spots = clustered ? clusteredSpots(Math.round(target * 1.6))
                          : stratifiedSpots(target);

  let placed = 0;
  for (const [sx, sy] of spots) {
    if (placed >= target) break;
    const base = palette ? palette[Math.floor(Math.random() * palette.length)] : randomScatterModel();
    const m = orientModel(base);
    const [ox, oy] = fitSpot(m, sx, sy);
    if (areaFree(m, ox, oy, SCATTER_PAD)) {
      stampModel(m, ox, oy);
      placed++;
    }
  }

  recount();
  draw();
  const CULTURE = ['Monocultura', 'Dualcultura', 'Tricultura'];
  const layout = clustered ? 'em bairros' : 'espalhados';
  toast(palette
    ? `${CULTURE[palette.length - 1]} ${layout}: ${placed} peças de ${palette.map(m => m.name).join(' + ')}`
    : `${placed} modelos ${layout} pelo mundo`);
}

document.getElementById('seedBtn').onclick = scatterModels;

// --- modo infinito --------------------------------------------------------

const STALE_WINDOW = 120;    // gerações observadas para julgar estagnação
const INJECT_COOLDOWN = 240; // mínimo entre duas injeções
const CROWDED = 6000;        // mundo cheio: não precisa de mais nada

// O mundo estagnou? População zerada, ou oscilando com período curto —
// o que cobre tanto o mundo morto quanto o assentado em blocos e blinkers.
function worldIsStale() {
  if (aliveCount === 0) return true;
  if (popHistory.length < STALE_WINDOW + 30) return false;
  for (let p = 1; p <= 30; p++) {
    let same = true;
    for (let i = popHistory.length - 1; i >= popHistory.length - STALE_WINDOW; i--) {
      if (popHistory[i] !== popHistory[i - p]) { same = false; break; }
    }
    if (same) return true;
  }
  return false;
}

function feedWorld() {
  const n = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) insertModel(orientModel(randomModel()), true);
  lastInject = generation;
  popHistory.length = 0;
}

const edgeBtn = document.getElementById('edgeBtn');
edgeBtn.onclick = () => {
  wrapEdges = !wrapEdges;
  edgeBtn.classList.toggle('off', wrapEdges);
  toast(wrapEdges
    ? 'Passagem ligada: quem sai por um lado entra pelo outro'
    : 'Sem passagem: quem cruza a borda morre');
};

const infiniteBtn = document.getElementById('infiniteBtn');
infiniteBtn.onclick = () => {
  infiniteMode = !infiniteMode;
  infiniteBtn.classList.toggle('off', !infiniteMode);
  popHistory.length = 0;
  lastInject = -Infinity;
  toast(infiniteMode
    ? 'Infinito: sempre que o mundo assentar, entram modelos novos'
    : 'Infinito desligado');
};

// Sorteia (com peso) sem repetir o mesmo modelo duas vezes seguidas.
let lastModel = null;
document.getElementById('modelBtn').onclick = () => {
  let m = randomModel();
  for (let tries = 0; tries < 8 && m === lastModel; tries++) m = randomModel();
  lastModel = m;
  insertModel(orientModel(m));
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'm') return document.getElementById('modelBtn').click();
  if (e.key === 'x') return document.getElementById('rndColorBtn').click();
  if (e.key === 'i') return infiniteBtn.click();
  if (e.key === 'b') return edgeBtn.click();
  if (e.key === '0') return resetView();
  if (e.code === 'Space') { e.preventDefault(); setRunning(!running); }
  else if (e.key === 's') stepOnce();
  else if (e.key === 'c') document.getElementById('clearBtn').click();
  else if (e.key === 'r') randomize();
  else if (e.key === 'g') gridBtn.click();
  else if (e.key === 'f') toggleFullscreen();
});

// --- início ---------------------------------------------------------------

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});

resize();
setRunning(true);
seedCycle();        // o ciclo de cor já começa ligado

// A tela nunca abre vazia: sempre um modelo sorteado rodando no centro.
const opening = orientModel(randomModel());
centerModel(opening);
toast(`${opening.name} — ${opening.note}`);   // mundo vazio, mas já rodando: basta desenhar e viver

// A barra começa aberta para não ficar escondida de quem chega agora.
// Passados 10 s ela recolhe e volta a depender do mouse no topo — a menos
// que o ponteiro já esteja sobre ela, e aí showBar() cancela este timer.
bar.classList.add('show');
barTimer = setTimeout(() => bar.classList.remove('show'), 10000);

requestAnimationFrame(loop);
</script>
